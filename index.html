<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Trivia | A Brain Teaser Every Day</title>
    <meta name="description" content="Test your knowledge with our Daily Trivia challenge. A new premium interactive question every day.">
    <link rel="stylesheet" href="style.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container fade-in">
        <header>
            <h1>Daily Trivia</h1>
            <div id="date-display" class="date-display">Friday, March 27, 2026</div>
        </header>

        <main class="trivia-card">
            <div id="question-area" class="question-area">
                <h2 id="question-text">Loading question...</h2>
                <div id="options-grid" class="options-grid">
                    <!-- Options will be injected here -->
                </div>
            </div>

            <div class="controls">
                <button id="confirm-btn" class="btn btn-primary" disabled>
                    Confirm Answer
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>

            <div class="nav-footer">
                <button id="prev-btn" class="nav-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Previous Day
                </button>
                <button id="next-btn" class="nav-btn" disabled>
                    Next Day
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </main>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
